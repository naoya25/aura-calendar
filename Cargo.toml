[package]
name = "aura-calendar"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 非同期処理
tokio = { version = "1", features = ["rt", "time", "sync", "macros"] }
reqwest = { version = "0.12", features = ["rustls-tls"] }
rrule = "0.13"
thiserror = "2"
minijinja = "2"
webbrowser = "0.8"
urlencoding = "2"
unicode-width = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# トレイメニュー表示中に ^+S を再度押された際、tray-icon crate に
# メニューを閉じる公開APIが無いため NSMenu.cancelTracking() を直接呼ぶ。
# また、メニューの開閉状態を正確に追跡するため
# NSMenuDidBeginTrackingNotification / NSMenuDidEndTrackingNotification を
# NSNotificationCenter 経由で購読する（block ベースの API のため block2 も必要）。
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSMenu", "NSStatusItem"] }
objc2-foundation = { version = "0.3", features = ["NSNotification", "NSOperation", "NSString", "block2"] }
block2 = "0.6"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
